# camerad: lift ONE template confinement, for libcamera's IPA proxy.
#
# libcamera runs its image-processing algorithms out of process: its
# Process::start forks the proxy with a raw clone3 (CLONE_NEWUSER |
# CLONE_NEWNET, no glibc fallback). systemd cannot filter clone3's
# struct-passed flags, so ANY RestrictNamespaces value — including an
# allowlist naming exactly user and net — blanket-denies clone3 with
# ENOSYS, and every camera registration fails with no log line (bench
# 2026-10-22: "Failed to fork: Function not implemented" the moment the
# namespaces allowlist was tried, then clean registration with the option
# reset). The empty assignment resets the template's yes. Everything else
# the template confines stays confined; the proxy runs under the unit's
# own cgroup and the same seccomp baseline.
[Service]
RestrictNamespaces=
