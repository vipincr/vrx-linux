# Terminal, debug images only: the applet is the bench's shell, so sudo
# must work in it (owner, 2026-10-13) and root must be able to do what
# root does. Every confinement the template sets is lifted here; the
# applet still runs as vrx-terminal until someone types sudo.
[Service]
NoNewPrivileges=no
RestrictSUIDSGID=no
# the template empties the bounding set; "~" with nothing named is all
CapabilityBoundingSet=~
ProtectSystem=no
ProtectHome=no
PrivateTmp=no
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectControlGroups=no
ProtectClock=no
ProtectHostname=no
LockPersonality=no
RestrictRealtime=no
RestrictNamespaces=no
SystemCallArchitectures=
RestrictAddressFamilies=
DevicePolicy=auto
DeviceAllow=
UMask=0022
