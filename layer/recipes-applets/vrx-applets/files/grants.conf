# Plan 0008 D2: what each manifest system grant ([applet.permissions]
# system = [...]) becomes. A grant is a group membership; the service
# behind it already checks that group (D-Bus bus policy or polkit rule).
# One home for this mapping: vrx-applet.inc reads it to generate each
# applet unit's SupplementaryGroups, and a vrx-linux test checks its keys
# against SystemGrant (G017).
#
# grant = group [device class...]
#
# Device classes become DeviceAllow=<class> rw lines (with DevicePolicy=
# closed in every applet unit): a device not granted cannot be opened at
# all, whatever its permissions say. Classes are /proc/devices names, as
# systemd.resource-control(5) "char-<name>" takes them.
network = netdev
bluetooth = bluetooth
time = datetime
hostname = vrx-hostname
power = vrx-power
usb = vrx-usb
apps = vrx-apps
serve = vrx-serve
gpio = gpio
i2c = i2c char-i2c
spi = spi char-spi
serial = dialout char-ttyS char-ttyAMA char-ttyUSB char-ttyACM
audio = audio char-alsa
camera = video char-video4linux
input = input char-input
iio = iio char-iio
# write any applet's settings file (plan 0008 D5): the group owns
# /etc/vrx/settings, and path: lets the unit write there (ReadWritePaths)
settings = vrx-config path:/etc/vrx/settings
# change how the screen behaves (plan 0010 D7): the group owns
# /etc/vrx/display (brightness, the idle timeout), which the compositor
# alone applies; nothing grants writing the backlight itself
display = vrx-display path:/etc/vrx/display
