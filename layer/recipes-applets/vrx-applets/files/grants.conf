# Plan 0008 D2: what each manifest system grant ([applet.permissions]
# system = [...]) becomes. A grant is a group membership; the service
# behind it already checks that group (D-Bus bus policy or polkit rule).
# One home for this mapping: vrx-applet.inc reads it to generate each
# applet unit's SupplementaryGroups, and a vrx-linux test checks its keys
# against SystemGrant (G017).
#
# grant = group [device class...]
#
# Device classes become DeviceAllow=<class> rw lines (with DevicePolicy=
# closed in every applet unit): a device not granted cannot be opened at
# all, whatever its permissions say. Classes are /proc/devices names, as
# systemd.resource-control(5) "char-<name>" takes them.
network = netdev
bluetooth = bluetooth
time = datetime
hostname = vrx-hostname
power = vrx-power
# the USB gadget's file sharing (polkit, 50-vrx.rules), and on a board with
# host ports (plan 0019 D10) the two host actions vrxhost does for the
# holder: eject a drive, "Allow new USB devices"
usb = vrx-usb
# read the drives plugged into the board (plan 0019 D10): they mount
# read-only under /run/vrx/usb with this group (vrx-usb-mount's gid=), so
# the group is the whole grant; no grant here ever names a USB or block
# device class (G064)
usb-media = vrx-usb-media
apps = vrx-apps
serve = vrx-serve
gpio = gpio
i2c = i2c char-i2c
spi = spi char-spi
serial = dialout char-ttyS char-ttyAMA char-ttyUSB char-ttyACM
audio = audio char-alsa
# the camera devices themselves (plan 0018 D10): the V4L2 nodes, the media
# graph and sub-device nodes libcamera drives, and the DMA heap it allocates
# frame buffers from. Only camerad holds it (G056). The media and dma_heap
# class names are the /proc/devices names; confirm them on the first board
# (plan 0018, "Verification duty").
camera = video char-video4linux char-media char-dma_heap
# use the camera through camerad (plan 0018 D10): open its frames and photos
# channels and send sys.camera.capture. No device access: the group carries
# nothing, vrxhost checks the grant in the manifest at Open (G057)
camera-use = vrx-camera-use
# read the folder camerad keeps its photos in (plan 0018 D10, D15): /data/photos,
# setgid, owned by camerad's user, group vrx-photos
photos = vrx-photos path:/data/photos
input = input char-input
iio = iio char-iio
# the local model servers (plan 0011 D18): the group of their unix sockets
# (/run/vrx-ml/llm.sock, stt.sock); the models themselves are opt-in
# recipes in the image (meta-vrx, VRX_ML_MODELS)
ml = vrx-ml
# the system's locale, which the time format follows (localed's SetLocale,
# plan 0011 D7); the polkit rule is vrx-policy's
locale = vrx-locale
# read what each applet costs and why the device is awake (plan 0012
# D12); vrxhost checks it, the group carries nothing else
power-stats = vrx-power-stats
# background scripts (plan 0013 D13): the polkit rule lets this group
# start, stop and clear vrx-script@*.service, the layer's template with a
# fixed ExecStart and the applet sandbox, and no other unit
scripts = vrx-scripting
# offer and install software updates, restart into them (plan 0016 D11)
update = vrx-update
# write any applet's settings file (plan 0008 D5): the group owns
# /etc/vrx/settings, and path: lets the unit write there (ReadWritePaths)
settings = vrx-config path:/etc/vrx/settings
# change how the screen behaves (plan 0010 D7): the backlight's sysfs
# brightness (70-vrx-backlight.rules) and /etc/vrx/display (the idle
# timeout; the brightness where there is no backlight to dim). An applet
# unit's ProtectKernelTunables makes /sys read-only, and
# /sys/class/backlight is a directory of links into /sys/devices, so the
# writable path is /sys/devices: the unit runs as no root and with no
# capability, so the files its groups may write there are what the udev
# rule opens (brightness, to vrx-display) and nothing else
display = vrx-display path:/etc/vrx/display path:/sys/devices
# pair the device with a home app and choose what it shows there (plan
# 0015 D9): the group of vrx-matter's socket, /run/vrx-matter/io.vrx.Matter
matter = vrx-matter
