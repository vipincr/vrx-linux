# vrx-linux: the applet OS layer.
#
# Consumed by the vrx build as its own layer (plan 0007 part L): the
# vrx-linux repo is a submodule under layers/vrx, registered as the
# opt-in `app` layerset; the image payload turns on through VRX_APPS.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "vrx-linux"
# the layer's own root, for files more than one recipe reads (grants.conf)
VRX_LINUX_LAYERDIR := "${LAYERDIR}"
BBFILE_PATTERN_vrx-linux = "^${LAYERDIR}/"
BBFILE_PRIORITY_vrx-linux = "12"

LAYERSERIES_COMPAT_vrx-linux = "wrynose"

LAYERDEPENDS_vrx-linux = "core"
