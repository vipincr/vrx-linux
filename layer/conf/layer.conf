# vrx-linux: the applet OS layer.
#
# Consumed by the vrx build as its own layer (plan 0007 part L): the
# vrx-linux repo is a submodule under layers/vrx, registered as the
# opt-in `app` layerset; the image payload turns on through VRX_APPS.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "vrx-linux"
# the layer's own root, for files more than one recipe reads (grants.conf)
VRX_LINUX_LAYERDIR := "${LAYERDIR}"
# the numbers of the accounts this layer makes (vrx and vrx-*), beside the
# distro's tables (vrx plan 0021 D2, G073)
USERADD_UID_TABLES:append = " files/vrx-linux-passwd"
USERADD_GID_TABLES:append = " files/vrx-linux-group"
# The one commit every recipe of this layer builds from (vrxhost, the
# CLI, Manage, vrx-matter and every built-in applet share one checkout and one
# workspace lockfile, whose crates layer/recipes-core/vrx-workspace-crates.inc
# lists). Bumped once per code change: commit the code, set this, commit the
# layer, then bump the submodule in vrx.
VRX_LINUX_SRCREV = "0fc8e430d5e0c6ce6da123c04315166e004c8601"
BBFILE_PATTERN_vrx-linux = "^${LAYERDIR}/"
BBFILE_PRIORITY_vrx-linux = "12"

LAYERSERIES_COMPAT_vrx-linux = "wrynose"

LAYERDEPENDS_vrx-linux = "core"
