# Plan 0008 D5: applet settings, one key=value file per applet. Every
# applet reads its own (ProtectSystem leaves /etc readable); the group
# vrx-config (the settings grant) writes any, the directory setgid so
# a file it makes stays in the group.
d /etc/vrx/settings 2775 root vrx-config -
# the system's own settings: the OS's reserved id (vrx is never an
# applet). The compositor turns the light off after light_off seconds
# without input (0: never); Settings > Display steps through the choices.
f /etc/vrx/settings/vrx.conf 0664 root vrx-config - light_off=120
z /etc/vrx/settings/*.conf 0664 root vrx-config -
