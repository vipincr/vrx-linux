# Plan 0010 D7: the compositor's own screen settings, the ones Linux has
# no home for. light_off is the seconds without input before the screen
# goes off (0: never); output= picks the display. brightness is here only
# where the compositor dims by plane alpha (no backlight levels): where
# the backlight has levels, its sysfs brightness is the home. The group
# vrx-display (the display grant: Settings, the shell) writes the file,
# the directory setgid so a file it makes stays in the group.
d /etc/vrx/display 2775 root vrx-display -
f /etc/vrx/display/screen.conf 0664 root vrx-display - light_off=120
z /etc/vrx/display/screen.conf 0664 root vrx-display -
