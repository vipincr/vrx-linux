# Plan 0010 D7: the screen's settings, one file the compositor watches and
# alone applies. brightness is a position, 0 to 100 (the compositor keeps
# 0 visible: the screen is never made dark by hand); light_off is the
# seconds without input before the screen goes off (0: never). The group
# vrx-display (the display grant: Settings, the shell) writes it, the
# directory setgid so a file it makes stays in the group. The compositor
# keeps keys of its own here too (output=).
d /etc/vrx/display 2775 root vrx-display -
f /etc/vrx/display/screen.conf 0664 root vrx-display - brightness=100\nlight_off=120
z /etc/vrx/display/screen.conf 0664 root vrx-display -
