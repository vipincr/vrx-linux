<!-- Plan 0008 D2: what the network and bluetooth grants mean on the
     system bus. Installed under /etc/dbus-1/system.d, read after the
     services' own files, so its default-context rules override theirs.
     A grant is the group; the unit puts an applet in it. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- network: connman's own policy admits root and console users only -->
  <policy group="netdev">
    <allow send_destination="net.connman"/>
  </policy>

  <!-- bluetooth: BlueZ's own policy lets ANY user send to org.bluez (bench
       2026-10-13: an unprivileged applet changed Adapter1.Pairable). Only
       root (bluetoothd's peers) and the bluetooth group keep it. -->
  <policy context="default">
    <deny send_destination="org.bluez"/>
  </policy>
  <policy group="bluetooth">
    <allow send_destination="org.bluez"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
