<!-- Plan 0015 D4, D10: vrx-matter's BLE commissioning registers its GATT
     application and LE advertisement with BlueZ, only on a board with
     Bluetooth (the recipe's bluetooth PACKAGECONFIG) and only once
     vrxhost's arbiter agreed (G044). vrx-policy's zz-vrx.conf keeps
     org.bluez from every other user; a user's policy outranks that
     default context whatever the file order. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="vrx-matter">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
