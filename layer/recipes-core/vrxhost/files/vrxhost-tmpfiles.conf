# vrxhost's runtime directories (plan 0007 amendment B). Created at boot
# by systemd-tmpfiles, before vrxhost starts: the unit's ReadWritePaths
# needs /tmp/vrx to exist when the mount namespace is built. No age
# field: never cleaned while the system runs.
#
# /tmp/vrx: group vrx with the setgid bit, so the socket vrxhost binds
# here inherits group vrx and applets (the vrx user) can connect; the
# sticky bit, so an applet can never unlink the socket or another
# applet's pipe.
d /tmp/vrx 3770 root vrx -
# /tmp/vrx/home: one private home per applet, made by vrxhost on first
# start and owned by the applet user. Applets can enter it but not add
# to it.
d /tmp/vrx/home 0751 root vrx -
