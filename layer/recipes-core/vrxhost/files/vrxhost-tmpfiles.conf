# The intent socket's directory (plan 0007 amendment B). Created at boot
# by systemd-tmpfiles, before vrxhost starts: the unit's ReadWritePaths
# needs it to exist when the mount namespace is built. Group vrx with
# the setgid bit, so the socket vrxhost binds here inherits group vrx and
# applets running as the vrx user can connect. No age field: never
# cleaned while the system runs.
d /tmp/vrx 2770 root vrx -
