# vrxhost's runtime directory (plan 0008 D8). Created at boot by
# systemd-tmpfiles before vrxhost starts. Group vrx with the setgid bit,
# so the io.vrx.Host socket vrxhost binds here is group vrx and every
# applet (each a member of vrx) can connect; nobody else can enter.
d /run/vrx 2750 root vrx -
# Installs (plan 0011 D16): offers wait in /var/lib/vrx/offers, merged
# extensions live in /var/lib/extensions (systemd-sysext's own place),
# and vrxhost hands vrx-install.service its request in /run/vrx/install.
d /var/lib/vrx/offers 0755 root root -
d /var/lib/extensions 0755 root root -
d /run/vrx/install 0700 root root -
# the energy record (plan 0012 D9): a day of minutes on tmpfs, hourly
# summaries kept 14 days on /data
d /run/vrx/energy 0750 root root -
d /data/vrx/energy 0750 root root 14d
# software update (plan 0016 D11): bundles wait in updates, written by the
# install helper (the USB drive) and vrx-manage (an upload, as a member of
# vrx-update); vrxhost's record of a restart into a trial is in update
d /data/vrx/updates 2770 root vrx-update -
d /data/vrx/update 0750 root root -
