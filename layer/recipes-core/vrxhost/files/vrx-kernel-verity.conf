# Plan 0013 D3: a system extension's signature is the kernel's to verify,
# against the keyring it was built with (CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG,
# VRX_INSTALL_CERT). systemd can also verify one in userspace against
# certificates under /etc/verity.d when it is built with OpenSSL; root can
# write /etc, so vrx turns that path off for every unit that dissects or
# merges an extension. vrxhost's install helper sets the same for the
# systemd-dissect it runs.
[Service]
Environment=SYSTEMD_ALLOW_USERSPACE_VERITY=0
