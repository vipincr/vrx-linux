# Plan 0013 D3: a release image merges only signed system extensions.
# systemd-sysext reads this at boot and for every merge through its
# Varlink socket; vrxhost reads the same file and inspects an offer under
# the same policy (vrx_protocol::sysext::SIGNED_DROPIN), so the launcher
# never offers what systemd would refuse. "signed" means dm-verity with a
# root hash signature the kernel verified against its built-in keyring
# (CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG, the certificate from
# VRX_INSTALL_CERT): root on the device cannot add a trusted key. This is
# systemd's own image_policy_sysext_strict. Debug images ship no drop-in.
[SysExt]
ImagePolicy=root=signed+absent:usr=signed+absent:=ignore
