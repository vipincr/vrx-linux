# The local models' home (plan 0011 D18), on /data through /var/lib.
# models/ and status/ are vrx-ml-fetch's; wanted/ is where an applet with
# the ml grant (group vrx-ml) asks for one, setgid so the file it makes
# stays in the group.
d /var/lib/vrx-ml 0755 root root -
d /var/lib/vrx-ml/models 0755 root root -
d /var/lib/vrx-ml/status 0755 root root -
d /var/lib/vrx-ml/wanted 2770 root vrx-ml -
