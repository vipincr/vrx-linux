# Recorder (plan 0008 Part F): play back always, record only where the
# board has a capture device (D12). ALSA's aplay and arecord, as
# vrx-recorder with the audio grant; recordings are WAV files in its
# state directory, on /data.
[applet]
id = "recorder"
name = "Recorder"
version = "1.0.0"
runtime = "flutter"

[applet.display]
icon = "mic"
tile = true
position = 8

[applet.resources]
heap_mb = 64

[applet.permissions]
system = ["audio"]

[applet.command]
enabled = false
