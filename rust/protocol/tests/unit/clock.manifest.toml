[applet]
id = "clock"                   # [a-z][a-z0-9_]*, max 32, "vrx" refused
name = "Clock"                 # what a person reads, max 32
version = "2.0.0"
runtime = "flutter"            # "flutter" | "rust" | "native"

[applet.display]
icon = "schedule"              # a Material Symbol name (VrxSymbols)
tile = true
position = 3
orientation = "landscape"

[applet.resources]
heap_mb = 128

[applet.roles]
home = false
shell = false
installs = false
# the clock is the schedule (plan 0008 D9): alarms and timers fire
# whether or not it was opened, so it is alive from boot
resident = true

[applet.permissions]
# time: the home zone. A ring lights the screen by holding it on
# (VrxKeepScreenOn, plan 0010 D3), which needs no grant
system = ["time"]

[applet.intents]
handles = [
    { name = "sys.alarm.ring", priority = 900, at = "ring" },
    { name = "vrx.open", priority = 500 },
]
# it sends sys.alarm.ring itself, to come to the front when one is due
emits = ["sys.alarm.ring", "app.finished"]

[applet.routes]
# Route 0 is the root (never declared); declaration order is the numbering
world = {}                     # route 1
alarms = {}                    # route 2
timer = {}                     # route 3
ring = {}                      # route 4 (the sys.alarm.ring deep link)
zone = {}                      # route 5 (choose the home zone)

[applet.command]
enabled = false

# plan 0008 D5: /etc/vrx/settings/clock.conf, shown in Settings > Applets
[[applet.settings]]
key = "clock_format"
label = "Time format"
category = "Clock"
type = "enum"
default = "24h"
options = ["24h", "12h"]
