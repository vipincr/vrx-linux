# Wi-Fi: scan, join (open, saved, with a passphrase), disconnect, forget.
# No tile (evrx-rt: Wi-Fi is a setting, not an application); Settings
# and Setup open it. Its system grant is network: connman decides.
[applet]
id = "wifi"
name = "Wi-Fi"
version = "1.0.0"
runtime = "flutter"

[applet.display]
icon = "wifi"
tile = false

[applet.resources]
heap_mb = 64

[applet.permissions]
system = ["network"]

[applet.routes]
nearby = {}

[applet.command]
enabled = false
