# Licences: every package the image carries and its licence, read from
# Yocto's own license manifest (/usr/share/common-licenses). No tile:
# Settings > About and Setup's licence step open it.
[applet]
id = "docs"
name = "Licences"
version = "1.0.0"
runtime = "flutter"

[applet.display]
icon = "gavel"
tile = false

[applet.resources]
heap_mb = 48

[applet.routes]
licences = {}

[applet.command]
enabled = false
