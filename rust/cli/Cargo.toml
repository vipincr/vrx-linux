[package]
name = "vrx-cli"
version = "0.1.0"
edition = "2021"
description = "The vrx command-line tool: new/dev/build/install/test"
license = "MIT"

[[bin]]
name = "vrx"
path = "src/main.rs"

[dependencies]
vrx-protocol = { path = "../protocol" }
# `vrx camera` is a client of camerad: it opens the same channel an applet does
vrx = { path = "../sdk" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
