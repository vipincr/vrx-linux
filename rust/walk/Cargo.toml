[package]
name = "vrx-walk"
version = "0.1.0"
edition = "2021"
description = "vrx-walk: plays a walk on the board through uinput and measures it (plan 0014 D9)"
license = "MIT"

[[bin]]
name = "vrx-walk"
path = "src/main.rs"

[dependencies]
vrx-protocol = { path = "../protocol" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rustix = { version = "1.1.5", default-features = false, features = ["fs", "event", "process", "std"] }
