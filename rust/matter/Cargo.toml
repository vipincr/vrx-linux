[package]
name = "vrx-matter"
version = "0.1.0"
edition = "2021"
description = "vrx-matter: the device on a Matter fabric, its screen and the applets a person exposes (plan 0015)"
license = "MIT"

[[bin]]
name = "vrx-matter"
path = "src/main.rs"

[features]
# The SDK's published test attestation (VID 0xFFF1): a debug image only.
# The recipe turns it on when VRX_DEBUG = "1" and the image refuses a
# release build that carries it (G042); without it there is no
# attestation and the binary refuses to start.
default = ["test-attestation"]
test-attestation = []
# BLE commissioning (plan 0015 D4, D5): rs-matter's BTP over BlueZ's GATT.
# The recipe turns it on where MACHINE_FEATURES has bluetooth; without it
# the QR code offers the network alone.
ble = []

[dependencies]
vrx-protocol = { path = "../protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
zlink = { version = "0.7.1", default-features = false, features = ["tokio", "server", "tracing"] }
# rs-matter: pinned, 0.x (plan 0015 D2); its Avahi mDNS and its BlueZ
# GATT peripheral (BLE commissioning) are the zbus feature
rs-matter = { version = "=0.4.1", default-features = false, features = ["os", "rustcrypto", "log", "zbus"] }
# rs-matter runs on embassy-time's std driver; its timer queue is supplied by
# embassy-executor's integrated queue unless a generic one is chosen, and we
# run no embassy executor, so the generic queue is named here. Without it a
# GNU ld link fails: undefined __embassy_time_queue_item_from_waker
# (the 2026-10-14 cm4 build; ld64 on macOS dead-strips the reference).
embassy-time = { version = "0.5", features = ["std", "generic-queue-64"] }
async-io = "2"
embassy-futures = "0.1"
log = "0.4"
rand = "0.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
