[package]
name = "vrx"
version = "0.1.0"
edition = "2021"
description = "The vrx Rust SDK: the applet store, the IPC clients, and the console kit"
license = "MIT"

[dependencies]
vrx-protocol = { path = "../protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
serde = { workspace = true }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["fs", "net", "std"] }
