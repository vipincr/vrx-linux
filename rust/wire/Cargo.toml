[package]
name = "vrx-wire"
version = "0.1.0"
edition = "2021"
description = "The Varlink server skeleton vrxhost and vrx-matter share"
license = "MIT"

[dependencies]
tokio = { workspace = true }
zlink = { version = "0.7.1", default-features = false, features = ["tokio", "server", "tracing"] }
rustix = { version = "1.1.5", default-features = false, features = ["fs", "net", "std"] }
tracing = { workspace = true }

[lints]
workspace = true
