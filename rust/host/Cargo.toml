[package]
name = "vrx-host"
version = "0.1.0"
edition = "2021"
description = "vrxhost: the vrx applet OS daemon (registry, supervisor, intents, trail)"
license = "MIT"

[[bin]]
name = "vrxhost"
path = "src/main.rs"

[dependencies]
vrx-protocol = { path = "../protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
# SOCK_SEQPACKET to the compositor (compositor.rs); same version tokio
# already pulls, "all" for the seqpacket type
socket2 = { version = "0.6", features = ["all"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
zlink = { version = "0.7.1", default-features = false, features = ["tokio", "server", "tracing"] }
futures-util = { version = "0.3.34", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
