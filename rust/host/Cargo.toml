[package]
name = "vrx-host"
version = "0.1.0"
edition = "2021"
description = "vrxhost: the vrx applet OS daemon (registry, supervisor, intents, trail)"
license = "MIT"

[[bin]]
name = "vrxhost"
path = "src/main.rs"

[dependencies]
vrx-protocol = { path = "../protocol" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
# the identity drop in the applet's pre-exec (launch.rs)
libc = "0.2"
# SOCK_SEQPACKET to the compositor (compositor.rs); same version tokio
# already pulls, "all" for the seqpacket type
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
