[package]
name = "vrx-host"
version = "0.1.0"
edition = "2021"
description = "vrxhost: the vrx applet OS daemon (registry, supervisor, intents, trail)"
license = "MIT"

[[bin]]
name = "vrxhost"
path = "src/main.rs"

[dependencies]
vrx-protocol = { path = "../protocol" }
# the SDK's watched file (inotify): the Matter allow-list
vrx = { path = "../sdk" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
# SOCK_SEQPACKET to the compositor (compositor.rs); same version tokio
# already pulls, "all" for the seqpacket type
socket2 = { version = "0.6", features = ["all"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
# /usr/lib/vrx/usb.toml, the image's USB host declaration (plan 0019)
toml = { workspace = true }
zlink = { version = "0.7.1", default-features = false, features = ["tokio", "server", "tracing"] }
futures-util = { version = "0.3.34", default-features = false }

[dev-dependencies]
tempfile = "3"
# paused time: the USB settle (plan 0019) without waiting it out
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

# a passed descriptor's seals (bridge.rs: a memfd sealed against shrinking)
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["fs", "net", "std"] }
