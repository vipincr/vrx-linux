name: vrx_kit
description: >-
  The vrx Flutter SDK: the applet store (model/reducer/view/effects),
  the design system (type roles by meaning, the spacing scale), the
  back-trail navigation, motion presets, and the IPC clients. Linux is
  the kernel; vrx is the OS; this package is what an applet imports.
publish_to: none

version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  dbus: ^0.8.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  vrx_check:
    path: ../vrx_check

flutter:
