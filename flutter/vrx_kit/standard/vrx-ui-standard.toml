# The vrx UI standard: every number a second implementation has to match, and the words it has to honour.
#
# This file is the single source (plan 0061 D4). scripts/make_ui_standard.py turns it into ui_metrics' token block
# (components/helpers/ui_metrics/include/ui_metrics/ui_standard.h) and into the expectations the host tests hold the
# hand-written tables to (tests/ui_standard_expect.h); the gate's ui-standard-generated refuses a stale copy. A
# second implementation (the Flutter kit in vrx-linux) pins this file by commit and generates its own tables from it.
#
# UNITS ARE NORMATIVE. A length is in millimetres, a type size in points, a time in milliseconds, a stiffness in the
# units of a spring of mass 1. Pixels are derived: here from the panel's density (CONFIG_VRX_PANEL_PPI, UI_MM), on a
# host that has no density from a scale over a 480 px short side. Both are sanctioned; a length that is written in
# pixels anywhere is a defect in whichever implementation wrote it.

[standard]
version = 1

# --- spacing and shape -----------------------------------------------------------------------------------------------
# The vocabulary of every pad, margin and gap. A layout that reaches outside it has not been thought about
# (UI_SPACE_EXACT names the rare exception and its reason).

[spacing_mm]
xs = 1
sm = 2
md = 3
lg = 4
xl = 6
edge_inset = 2        # between the glass edge and the client area

[radius_mm]
sm = 1
md = 2

# Window size classes (plan 0062 D20), Material's (compact below 600 dp wide and 480 dp high, medium to 840 and 900, expanded from
# there) at 160 dp to the inch, in tenths of a millimetre: the two edges between compact and medium and between medium and expanded. An
# applet reads a class and never a pixel count, so a layout is chosen by how much room there is.
[window]
width_x10mm = [952, 1334]
height_x10mm = [762, 1429]

# Sizes that are physical whatever the panel's density.
[size_mm]
touch_min = 9         # the smallest a finger is asked to hit (UI_TARGET_MIN where the board has touch)
icon_button = 5       # a glyph that is itself a control
status_button = 4     # a glyph in the status strip, an indicator and not a target
qr_min = 18           # the smallest a QR code can be for a phone's camera to read
drawer_pull_min = 27  # how far the quick drawer is pulled before it opens

# Lengths in device pixels, and the only ones. A line is drawn on whole pixels, so its width is a count of them and not a
# fraction of a millimetre: a second implementation has to draw the same line, and scaling it would give a hairline of 1.3
# pixels that anti-aliases to grey on a panel with four greys. Both are what the 219 PPI reference panel draws well, and the
# focus frame's smallest size (UI_FOCUS_MIN) is derived from them.

[device_px]
hairline = 2          # a rule, a thin frame, the seam between two controls
border = 3            # a control's frame, the focus frame

# --- gestures --------------------------------------------------------------------------------------------------------
# A swipe is a distance AND a speed: the distance separates it from a tap (Android's boundary is 8 dp, about 1.3 mm), the
# speed keeps a long press safe, whose finger drifts some 24 px/s on a 219 PPI panel against the 60 px/s floor.

[gesture]
swipe_min_mm = 2.5
swipe_min_px_per_s = 60    # the one speed written in pixels: about 7 mm/s at the reference 219 PPI (plan 0061 A rechecked it on traces)
touch_slop_mm = 2          # travel past which a contact is no longer a tap
wheel_step_mm = 4.5        # one step of a mouse wheel

# --- motion timing ---------------------------------------------------------------------------------------------------

[motion]
ms = 200                   # a scroll, a page turn and the focus ring's move on a scanned panel

# --- type ------------------------------------------------------------------------------------------------------------
# A role is chosen by what the text IS; its size follows from the density (make_type_scale.py snaps it to a face).

[type_pt]
display = 14.5
title = 12.5
subtitle = 11.2
body = 9.9
subtext = 8.5
micro = 6.6
clock = 42.1
code = 8.5

# --- colour slots (plan 0062) ------------------------------------------------------------------------------------------
# The 32 functional slots a screen is drawn from. A component names what a colour is FOR; the scheme gives the slot a
# colour on a colour panel, and the class's map gives it a grey on a grey one. Tones are CIE L* (0 black, 100 white), the
# same for every scheme, so a grey panel's table does not depend on the scheme. Order is the enum's and the index of every
# table. A slot from `inverse` on whose class is fill or container is followed by its on-colour.
#
#   class: what the slot is, which picks its grey in a grey class and its place in the pair rules
#   palette: which tonal palette the colour comes from (primary, secondary and tertiary follow the scheme's harmony rule)
#   chroma: a fraction of that palette's chroma (an on-colour at tone 100 has none; a container is tinted, not saturated)

[colour]
slot = [
  { name = "page",                    class = "surface",        light = 98,  dark = 6,   palette = "neutral",         chroma = 1.0 },
  { name = "surface",                 class = "surface",        light = 95,  dark = 11,  palette = "neutral",         chroma = 1.0 },
  { name = "surface_high",            class = "surface",        light = 90,  dark = 20,  palette = "neutral",         chroma = 1.0 },
  { name = "text",                    class = "text",           light = 10,  dark = 90,  palette = "neutral",         chroma = 1.0 },
  { name = "text_secondary",          class = "text_secondary", light = 30,  dark = 80,  palette = "neutral_variant", chroma = 1.0 },
  { name = "outline",                 class = "outline",        light = 50,  dark = 60,  palette = "neutral_variant", chroma = 1.0 },
  { name = "outline_faint",           class = "outline_faint",  light = 80,  dark = 30,  palette = "neutral_variant", chroma = 1.0 },
  { name = "focus",                   class = "focus",          light = 40,  dark = 80,  palette = "primary",         chroma = 1.0 },
  { name = "shadow",                  class = "shadow",         light = 0,   dark = 0,   palette = "neutral",         chroma = 0.0 },
  { name = "highlight",               class = "highlight",      light = 100, dark = 100, palette = "neutral",         chroma = 0.0 },
  { name = "inverse",                 class = "fill",           light = 20,  dark = 90,  palette = "neutral",         chroma = 1.0 },
  { name = "on_inverse",              class = "on_fill",        light = 95,  dark = 20,  palette = "neutral",         chroma = 1.0 },
  { name = "primary",                 class = "fill",           light = 40,  dark = 80,  palette = "primary",         chroma = 1.0 },
  { name = "on_primary",              class = "on_fill",        light = 100, dark = 20,  palette = "primary",         chroma = 0.3 },
  { name = "primary_container",       class = "container",      light = 90,  dark = 30,  palette = "primary",         chroma = 0.5 },
  { name = "on_primary_container",    class = "on_container",   light = 30,  dark = 90,  palette = "primary",         chroma = 0.8 },
  { name = "secondary",               class = "fill",           light = 40,  dark = 80,  palette = "secondary",       chroma = 1.0 },
  { name = "on_secondary",            class = "on_fill",        light = 100, dark = 20,  palette = "secondary",       chroma = 0.3 },
  { name = "secondary_container",     class = "container",      light = 90,  dark = 30,  palette = "secondary",       chroma = 0.6 },
  { name = "on_secondary_container",  class = "on_container",   light = 30,  dark = 90,  palette = "secondary",       chroma = 0.8 },
  { name = "tertiary",                class = "fill",           light = 40,  dark = 80,  palette = "tertiary",        chroma = 1.0 },
  { name = "on_tertiary",             class = "on_fill",        light = 100, dark = 20,  palette = "tertiary",        chroma = 0.3 },
  { name = "tertiary_container",      class = "container",      light = 90,  dark = 30,  palette = "tertiary",        chroma = 0.5 },
  { name = "on_tertiary_container",   class = "on_container",   light = 30,  dark = 90,  palette = "tertiary",        chroma = 0.8 },
  { name = "error",                   class = "fill",           light = 40,  dark = 80,  palette = "error",           chroma = 1.0 },
  { name = "on_error",                class = "on_fill",        light = 100, dark = 20,  palette = "error",           chroma = 0.3 },
  { name = "success",                 class = "fill",           light = 40,  dark = 80,  palette = "success",         chroma = 1.0 },
  { name = "on_success",              class = "on_fill",        light = 100, dark = 20,  palette = "success",         chroma = 0.3 },
  { name = "warning",                 class = "fill",           light = 40,  dark = 80,  palette = "warning",         chroma = 1.0 },
  { name = "on_warning",              class = "on_fill",        light = 100, dark = 20,  palette = "warning",         chroma = 0.3 },
  { name = "info",                    class = "fill",           light = 40,  dark = 80,  palette = "info",            chroma = 1.0 },
  { name = "on_info",                 class = "on_fill",        light = 100, dark = 20,  palette = "info",            chroma = 0.3 },
]

# Contrast floors, WCAG 2 ratio times 100, and the pairs they hold. first_pass: where a grey class has a one-bit first pass
# (an e-paper refresh paints black and white before the greys), the two sides must land either side of 128 in it, so the
# text is legible before the greys arrive. Decoration (outline_faint) is allowed to arrive late.
pair = [
  { bg = "page",              fg = "text",                   min = 700, first_pass = true },
  { bg = "surface",           fg = "text",                   min = 700, first_pass = true },
  { bg = "surface_high",      fg = "text",                   min = 450, first_pass = true },
  { bg = "page",              fg = "text_secondary",         min = 450, first_pass = true },
  { bg = "page",              fg = "outline",                min = 300, first_pass = true },
  { bg = "page",              fg = "focus",                  min = 300, first_pass = true },
  { bg = "page",              fg = "outline_faint",          min = 150, first_pass = false },
  { bg = "inverse",           fg = "on_inverse",             min = 450, first_pass = true },
  { bg = "primary",           fg = "on_primary",             min = 450, first_pass = true },
  { bg = "primary_container", fg = "on_primary_container",   min = 450, first_pass = true },
  { bg = "secondary",         fg = "on_secondary",           min = 450, first_pass = true },
  { bg = "secondary_container", fg = "on_secondary_container", min = 450, first_pass = true },
  { bg = "tertiary",          fg = "on_tertiary",            min = 450, first_pass = true },
  { bg = "tertiary_container", fg = "on_tertiary_container", min = 450, first_pass = true },
  { bg = "error",             fg = "on_error",               min = 450, first_pass = true },
  { bg = "success",           fg = "on_success",             min = 450, first_pass = true },
  { bg = "warning",           fg = "on_warning",             min = 450, first_pass = true },
  { bg = "info",              fg = "on_info",                min = 450, first_pass = true },
  { bg = "page",              fg = "primary",                min = 300, first_pass = false },
  { bg = "page",              fg = "error",                  min = 300, first_pass = false },
  { bg = "page",              fg = "success",                min = 300, first_pass = false },
  { bg = "page",              fg = "warning",                min = 300, first_pass = false },
  { bg = "page",              fg = "info",                   min = 300, first_pass = false },
]

# While a fill moves from the page to the primary and its text swaps ink where the two cross (ui_motion.c), the text is held to
# this ratio (times 100) on every frame of the way: the most two tonal inks can give at the crossing is about 3.4:1 against
# 4.58:1 for pure black and white, so in flight it is the WCAG floor for a user-interface component, 3:1, and at rest it is the
# pairs' 4.5:1. make_ui_schemes.py checks the path of every scheme.
[colour.transit]
floor_x100 = 300

# Colour generation (scripts/make_ui_schemes.py), OKLCh. A scheme is a seed hue and a harmony rule: the rule gives the
# secondary and tertiary hue as offsets in degrees from the seed (Itten's wheel). 4 seeds x 5 rules = 20 schemes, numbered
# seed-major (1 to 5 the first seed, in the rules' order below).
[generate]
seeds = ["blue", "green", "amber", "magenta"]
rules = ["analogous", "complementary", "split", "triadic", "tetradic"]
min_scheme_distance_x100 = 4.0   # two schemes differ by at least this in OKLab (times 100) in some brand slot, or the 20 are not twenty
harmonise_max_deg = 5       # a signal hue turns toward the seed by half the gap, at most this: red has to stay red (Material turns up to 15)

[generate.seed_hue]
blue = 255
green = 150
amber = 65
magenta = 330

[generate.rule_offsets]
analogous = [30, -30]
complementary = [0, 180]
split = [150, 210]
triadic = [120, 240]
tetradic = [60, 180]

[generate.signal_hue]
error = 27
warning = 78
success = 146
info = 250

[generate.chroma]            # OKLCh chroma at full strength; a slot takes its `chroma` fraction of it, and the gamut takes the rest
primary = 0.15
secondary = 0.07
tertiary = 0.12
neutral = 0.012
neutral_variant = 0.022
error = 0.15
warning = 0.12
success = 0.14
info = 0.14

# Pinned values: a generated table that moves one of these is a bug in the generator, so it refuses.
[pin_dark]
page = "#121212"            # the dark page the colour boards already draw on

# Grey classes. A grey panel draws a slot in the grey its class gives it, as 0xVV (r = g = b). grey4 and grey2 are authored
# by slot class and then repaired against the pairs; grey32 follows the slot's tone and is repaired the same way. Levels of
# grey4 are the band midpoints and ends of the quantiser (gray_quant_level: luminance >> 6); a first pass paints black below 128.
[grey4]
surface = 0xFF
text = 0x20
text_secondary = 0x60
outline_faint = 0xA0
outline = 0x00
focus = 0x00
shadow = 0x00
highlight = 0xFF
fill = 0x00
on_fill = 0xFF
container = 0xFF
on_container = 0x20

[grey2]
surface = 0xFF
text = 0x00
text_secondary = 0x00
outline_faint = 0x00
outline = 0x00
focus = 0x00
shadow = 0x00
highlight = 0xFF
fill = 0x00
on_fill = 0xFF
container = 0xFF
on_container = 0x00

# The ten roles the e-paper UI drew with before slots (the paper palette, #202020 #606060 #A0A0A0 on #FFFFFF and black), by
# their slot: grey4 must keep them, so the e-paper board's glass does not change.
[pin_grey4]
text = 0x20
text_secondary = 0x60
outline_faint = 0xA0
page = 0xFF
primary = 0x00
on_primary = 0xFF
outline = 0x00
focus = 0x00
shadow = 0x00
highlight = 0xFF

# --- display classes (plan 0062 D14) ---------------------------------------------------------------------------------
# Every number or choice that differs between kinds of panel, read through ui_class.h (private to ui_kit) by name. The build
# picks the row from facts it already has: a colour panel is lcd_colour; a scanned panel without colour is lcd_grey; an
# e-paper panel is epaper_grey, or epaper_mono at one bit. The motion tier stays Kconfig's (main/Kconfig), and with it the choice
# between a shadow and a heavier frame for elevation (a shadow exists only in the full tier, so the code for it does too).

[class.lcd_colour]
pressed_layer_permille = 200   # a state layer in `primary` over the control; 0 is the inversion
live_min_ms = 0                # a live readout (a meter, a bubble, a viewfinder) repaints at most this often
ambient_min_ms = 0             # an ambient change (a clock minute, a charging percentage) waits at most this long for a paint
dither = "none"                # how a pixel surface reaches the greys: none, by quality, or threshold

[class.lcd_grey]
pressed_layer_permille = 200   # a scanned panel has no waveform to save: the state layer of 1bbb2bd4 is kept
live_min_ms = 0
ambient_min_ms = 0
dither = "by_quality"

[class.epaper_grey]
pressed_layer_permille = 0
live_min_ms = 1000
ambient_min_ms = 60000
dither = "by_quality"

[class.epaper_mono]
pressed_layer_permille = 0
live_min_ms = 1000
ambient_min_ms = 60000
dither = "threshold"

