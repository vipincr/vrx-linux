# --- springs ---------------------------------------------------------------------------------------------------------
# Material 3's motion scheme (androidx StandardMotionTokens and ExpressiveMotionTokens). Stiffness and damping ratio,
# at MASS 1: a spring that moves a mass other than 1 must scale its stiffness by it. A component names a token and never
# a duration or a stiffness. Effects springs (colour, opacity) are critically damped, so they never overshoot.

[springs]
mass = 1

[springs.standard]
spatial_fast = { stiffness = 1400, damping = 0.9 }
spatial = { stiffness = 700, damping = 0.9 }
spatial_slow = { stiffness = 300, damping = 0.9 }
effects_fast = { stiffness = 3800, damping = 1.0 }
effects = { stiffness = 1600, damping = 1.0 }
effects_slow = { stiffness = 800, damping = 1.0 }

[springs.expressive]
spatial_fast = { stiffness = 800, damping = 0.6 }
spatial = { stiffness = 380, damping = 0.8 }
spatial_slow = { stiffness = 200, damping = 0.8 }
effects_fast = { stiffness = 3800, damping = 1.0 }
effects = { stiffness = 1600, damping = 1.0 }
effects_slow = { stiffness = 800, damping = 1.0 }

# --- microinteractions -----------------------------------------------------------------------------------------------
# One row for each thing a person acts on: what it does where things move, in tokens, and what it does where they do not.
# scale is permille of the element's own size (a press sinks to 970, a key's preview pops to 1300, a modal starts from
# 800); shift_px is how far below rest an arrival starts, or shift_mm where the distance is physical; stagger_ms is the
# gap between siblings. follow is the token of what follows the first (a track's fill, a scrim).

[micro.none]
token = "effects"
follow = "effects"
moves = "draws nothing, so nothing moves"
still = "the same"

[micro.press]
token = "spatial_fast"
follow = "spatial_fast"
scale = 970
moves = "the fill inverts at once, never faded, and the control sinks to 0.97 scale and back on spatial fast"
still = "the inversion, as before"

[micro.select]
token = "spatial"
follow = "effects"
moves = "the selection indicator slides to the new cell on spatial default"
still = "the cell inverts"

[micro.handle]
token = "effects"
follow = "effects"
moves = "the handle follows the finger (LVGL's own drag), and a step by key glides it to the new value, a slider's over LVGL's animation time and a knob's arc on the value row's token"
still = "the new value"

[micro.key]
token = "spatial_fast"
follow = "effects_fast"
scale = 1300
moves = "a pressed key pops a magnified preview above it on spatial fast, gone on lift; layer changes cross-fade on effects fast"
still = "the key inverts"

[micro.list]
token = "effects"
follow = "effects"
shift_px = 8
stagger_ms = 16
moves = "rows enter staggered, 16 ms apart, on effects default with a short rise"
still = "rows appear"

[micro.drawer]
token = "spatial"
follow = "effects"
moves = "follows a drag, flings open or shut on spatial default, rubber-bands past its stops"
still = "opens or shuts in one paint"

[micro.modal]
token = "spatial"
follow = "effects"
scale = 800
moves = "grows from its source on spatial default, the scrim on effects default; leaves the same way"
still = "appears, one paint"

[micro.banner]
token = "spatial"
follow = "spatial_fast"
moves = "slides in from its edge on spatial default, leaves on spatial fast"
still = "appears"

[micro.wheel]
token = "spatial"
follow = "spatial"
moves = "a body: drag, fling, detents, spring"
still = "steps a key per swipe"

[micro.value]
token = "effects"
follow = "effects"
moves = "a changed value of a knob or a progress ring eases on effects default; a live meter is not eased, since a level that trails the sound is wrong"
still = "the new value"

[micro.focus]
token = "spatial_fast"
follow = "spatial_fast"
moves = "the focus ring moves between controls on spatial fast"
still = "moves"

[micro.screen]
token = "spatial"
follow = "effects"
shift_mm = 10
moves = "a shared-axis slide: the new screen in from the side, the old one out as a picture, on spatial default; a light image slides without fading"
still = "replaces, one paint"

# --- the tier contract -----------------------------------------------------------------------------------------------
# What each tier promises, in words a second implementation can meet. The tier is a constant of a build, never decided
# at run time; there is no frame watchdog and no reduce-motion setting, since either would be the device deciding what
# its build already knows.

[tier.still]
promise = "Nothing moves. Every state change is one paint of the final state, and a pressed control shows its inversion and nothing else. A transform other than the identity is refused, and none of the motion engine is built."

[tier.light]
promise = "Springs move position, opacity and colour. A rotation or scale of an element larger than the board's limit lands at once, a fade is left out where its layer cannot be had, nothing is staggered, and a screen slides without fading."

