# vrx's glyphs (plan 0013 D5, G033): every glyph an applet or the kit may
# show, what it means, and where it may appear. `cargo xtask glyphs`
# generates flutter/vrx_kit/lib/src/symbols.dart (VrxSymbols) from this
# table and the Material Symbols catalogue vendored beside it
# (material-symbols.codepoints, the font recipe's pinned file): a glyph
# missing here does not exist in Dart. A glyph that means two things on
# two screens reads as a lie on one of them (evrx-rt docs/13, Glyphs), so
# each says one thing, and a new use either fits it or adds its own row.
#
# Domains:
#   signal       a state the person reads (connected, charging, a fault)
#   navigation   a way to somewhere (Back, a category, a direction)
#   action       a verb on a control (add, delete, send, stop)
#   applet-icon  one applet's face on Home; two applets never share one
#                (the gate and the registry refuse it)

