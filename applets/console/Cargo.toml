# console: a vrx Rust applet, a ring of lines that is also a pipeline stage.
[package]
name = "console"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
vrx = { path = "../../rust/sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"      # applet_main owns stdout
