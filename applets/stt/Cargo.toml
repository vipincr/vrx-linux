# stt: speech to text for vrx applets (plan 0011 D18). Resident, no
# screen: on sys.stt.listen it records through ALSA's arecord, finds the
# speech with evrx-rt's voice detector, has the local whisper-server write
# it down, and answers sys.stt.heard.
[package]
name = "stt"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
vrx = { path = "../../rust/sdk" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"      # stdout is not a log
