[applet]
id = "settings"
name = "Settings"
version = "1.0.0"
runtime = "flutter"

[applet.display]
icon = "settings"
tile = true
position = 4
orientation = "any"

[applet.resources]
heap_mb = 96

[applet.roles]
installs = false

[applet.permissions]
system = ["network", "bluetooth", "time", "hostname", "display", "power", "settings", "locale", "power-stats", "matter", "update"]
fs = ["/data/settings"]

[applet.intents]
handles = [
    { name = "vrx.open", priority = 600 },
    # the battery changed (vrxhost relays power_supply uevents, plan 0011 D12)
    { name = "sys.power.changed", priority = 600 },
]
emits = ["settings.changed"]

[applet.routes]
root = {}
list = {}
time = {}                      # Settings > Time (Clock's "Set the time")

[applet.command]
enabled = false

[[applet.settings]]
key = "theme"
label = "Theme"
category = "Appearance"
type = "enum"
default = "dark"
options = ["dark", "light"]
