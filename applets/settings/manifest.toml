[applet]
id = "settings"
name = "Settings"
version = "1.0.0"
runtime = "flutter"

[applet.display]
icon = "settings"
tile = true
position = 4
orientation = "any"

[applet.resources]
heap_mb = 96

[applet.roles]
installs = false

[applet.permissions]
system = ["network", "bluetooth", "time", "hostname", "display", "power"]
fs = ["/data/settings"]

[applet.intents]
handles = [{ name = "vrx.open", priority = 600 }]
emits = ["settings.changed"]

[applet.routes]
root = {}
list = {}

[applet.command]
enabled = false

[[applet.settings]]
key = "theme"
label = "Theme"
category = "Appearance"
type = "enum"
default = "dark"
options = ["dark", "light"]
