# The shell (plan 0008 Part C): the status strip across the top of every
# screen and the quick drawer under it, evrx-rt's host chrome. It draws
# what the system says (the time, Wi-Fi, the brightness) and acts through the
# services that own each thing. Resident: it is the chrome, never closed.
# The compositor places it above the focused app (D10; the overlay plane
# is proven on the bench first).
[applet]
id = "shell"
name = "Shell"
version = "1.0.0"
runtime = "flutter"

[applet.display]
icon = "dashboard"
tile = false

[applet.resources]
heap_mb = 48

[applet.roles]
shell = true
resident = true

[applet.permissions]
system = ["network", "display", "power"]

[applet.intents]
handles = [
    # the battery changed (vrxhost relays power_supply uevents, plan 0011 D12)
    { name = "sys.power.changed", priority = 600 },
    # a home app set the brightness (vrxhost relays Matter's Level Control,
    # plan 0015 D12): written through ScreenSettings, the one writer
    { name = "sys.screen.brightness", priority = 600 },
]

[applet.command]
enabled = false
