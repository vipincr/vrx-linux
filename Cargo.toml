# vrx-linux — the applet operating system for Linux processors.
#
# An applet OS shaped like evrx-rt (the MCU runtime) but running on Linux:
# vrxhost supervises applets (Flutter or Rust) and tells the compositor
# (flutter-vrx, its own repo) which one is on screen, and the SDK (Rust crate + Flutter package) gives developers
# the same store/model/view paradigm in both languages. Linux is the
# kernel; vrx is the OS.
#
# SPDX-License-Identifier: MIT

[workspace]
resolver = "2"
members = [
    "rust/protocol",
    "rust/host",
    "rust/sdk",
    "rust/cli",
    "rust/xtask",
    "rust/manage",
    "rust/walk",
    "rust/matter",
    "rust/wire",
    "rust/scan",
]

# applets/ are standalone: each is built and tested on its own (the
# way a developer's applet would be), never as a workspace member.
exclude = ["applets"]

# NEVER REMOVE (octiva lesson: cargo test at opt-level 0 is 31x slower;
# tests that touch DRM or the Flutter engine will time out):
#   [profile.dev] opt-level = 2
#   [profile.dev.package."*"] opt-level = 3
[profile.dev]
opt-level = 2
[profile.dev.package."*"]
opt-level = 3

# Plan 0008 D18: release is the only shipping build, optimized for the
# applet's event loop: whole-program LTO and one codegen unit (slower
# builds, faster and smaller binaries), opt-level 3.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# NOT stripped here: bitbake strips and splits debug symbols itself,
# and its QA fails a pre-stripped binary (already-stripped)
strip = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Internal (unpublished) crates: don't demand repository/keywords
# metadata; the duplicate-version policy is enforced by cargo-deny
# instead, where it is actionable (octiva precedent).
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# preserve_order: route numbering in the manifest follows declaration
# order; without it toml hands back a BTreeMap and the order is lost.
toml = { version = "0.8", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "process", "signal", "sync", "time", "macros"] }
